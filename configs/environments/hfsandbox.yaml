# Hugging Face Sandboxes provider — one dedicated HF Sandbox (an HF Job running
# the published `agentslastexam/ale-ubuntu22-docker` image) per run unit.
# Linux-only (same subset as the Docker provider). Needs a host HF token with
# Jobs and private bucket access (`hf auth login` or HF_TOKEN). The orchestrator can run anywhere
# with outbound HTTPS — a laptop or another HF Job — no local Docker needed.
provider: hfsandbox

image: ale-ubuntu22-docker        # -> agentslastexam/ale-ubuntu22-docker:latest
flavor: cpu-upgrade               # 8 vCPU / 32 GB; 3 docker_support tasks need cpu-xl (16 vCPU / 124 GB)
transport: job                    # job = HF Job + exposed port (default) | sandbox = HF Sandbox API port-proxy (buggy 2026-09)
job_timeout: 24h                  # (job) hard cap; the run kills the job on release anyway
idle_timeout: 3600                # (sandbox) self-terminate after 1h idle
start_timeout: 1800               # cold image pull of the ~40 GB image can take 10-15 min
resolution: [1024, 768]
# namespace: my-org               # bill sandboxes to an org instead of the token owner

# Task data setup (one-time, the image ships without it):
#   1. Request access to agents-last-exam/agents-last-exam-data-archive, then
#      download and extract ale-tasks-data.tar.gz on a trusted host.
#   2. Run scripts/prepare_hf_task_data.py on the extracted tree. Upload its
#      output to a NEW private bucket; see docs/ale-docs-site/pages/hf-sandbox.html.
#   3. Point volumes at that bucket. Each variant has reference.7z plus
#      reference.required, or reference.absent.
# The mounted bucket must contain no plaintext reference/ directory anywhere.
# Keep ALE_MOUNTED_REFERENCE_ARCHIVE_PASSWORD in the host's secret/.env, never
# in this file or in a Job secret. See docs/ale-docs-site/pages/hf-sandbox.html.
volumes:
  - hf://buckets/YOUR_NAMESPACE/NEW_PRIVATE_BUCKET:/mnt/ale-task-data:ro
task_data_source: mounted:/mnt/ale-task-data
# For data-less tasks only, drop volumes and use baked_in_sandbox.
output_path: local
