# example_hfsandbox_exp.yaml — run the HF Sandboxes provider end to end.
# Fill in the bucket in configs/environments/hfsandbox.yaml and set
# HF_INFERENCE_TOKEN plus ALE_MOUNTED_REFERENCE_ARCHIVE_PASSWORD in secret/.env
# first (see docs/ale-docs-site/pages/hf-sandbox.html), then:
# The default cpu-upgrade flavor cannot run 3 of the 99 listed tasks; use
# cpu-xl for the full list or exclude those tasks in a copied task list.
#
#     uv run python -m ale_run run example_hfsandbox_exp.yaml
#     uv run python -m ale_run run example_hfsandbox_exp.yaml --dry-run
#
# See example_exp.yaml for what each field means.

name: hfsandbox_example

secret_file: secret/.env

agents:
  - configs/agents/openhands_cli_hf.yaml
environment: configs/environments/hfsandbox.yaml

tasks: selected_tasks/docker_support.txt

output:
  root: .logs/ale
concurrency: 3
auto_resume: true
max_attempts: 3
cleanup_mode: delete
